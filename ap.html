<html lang="en">

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="AP Comparison" />
  <meta property="og:title" content="AP Details" />
  <meta property="og:description" content="Access point specifications from the vendor datasheet: PoE, behavior at minimum power, radios, antennas, mounts." />
  <meta property="og:url" content="https://apcomparison.com/ap.html" />
  <meta property="og:image" content="https://apcomparison.com/logo.png" />

<body>
  <header class="site-header" data-page="detail"></header>
  <script src="site-header.js?v=1"></script>
  <div class="container">
    <div class="actions">
      <a id="back-link" class="btn-link" href="index.html">&larr; Back to AP Table</a>
      <a id="edit-link" class="btn-link" href="#" style="display:none;">Edit AP Information</a>
      <a id="antenna-finder-link" class="btn-link" href="#" style="display:none;" target="_blank" rel="noopener noreferrer">Find compatible antennas &#8599;</a>
      <button id="export-csv" type="button" class="btn-link">Export CSV</button>
    </div>

    <div class="card">
      <span class="badge">AP Details</span>

      <h1 id="title-header">AP Details</h1>
      <p class="subtitle" id="subtitle"></p>
      <!-- Inline actions will be inserted here via JavaScript -->

      <div id="image-container" class="ap-image-wrapper" style="display:none;">
        <img id="ap-image" class="ap-image" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" alt="" loading="lazy" />
      </div>

      <div id="details" class="kv-grid"></div>

      <div id="error-message" class="error" style="display:none;"></div>
    </div>
  </div>

  <script src="ap-format.js?v=6"></script>
  <script>
    const DATA_URL = 'ap_data.json';
    let currentEntry = null;


    function readId() {
      const params = new URLSearchParams(window.location.search);
      return params.get('id') || '';
    }

    function backLabelForPath(path) {
      if (path && path.startsWith('finder.html')) return '\u2190 Back to AP Finder';
      if (path && path.startsWith('compare.html')) return '\u2190 Back to Compare';
      return '\u2190 Back to AP Table';
    }

    /** Keep the address bar id-only once Back is configured (drops legacy return=/from=/filters). */
    function stripLegacyBackParamsFromUrl() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id') || '';
      const keys = Array.from(params.keys());
      if (keys.length === 0 || (keys.length === 1 && keys[0] === 'id')) return;
      const clean = new URLSearchParams();
      if (id) clean.set('id', id);
      const qs = clean.toString();
      try {
        history.replaceState(null, '', qs ? `ap.html?${qs}` : 'ap.html');
      } catch (_) {
        /* ignore */
      }
    }

    /**
     * Detail Back: sessionStorage first (short detail URLs).
     * Legacy fallbacks: return=, from=finder + leftover filters, then leftover Browse filters on the detail URL.
     */
    function configureBackLink(backEl) {
      if (!backEl) return;

      const params = new URLSearchParams(window.location.search);
      const fromSession = readDetailBackPath();
      const fromReturn = safeReturnPath(params.get('return'));
      const target = fromSession || fromReturn;
      if (target) {
        backEl.setAttribute('href', target);
        backEl.textContent = backLabelForPath(target);
        stripLegacyBackParamsFromUrl();
        return;
      }

      const fromFinder = params.get('from') === 'finder';
      params.delete('id');
      params.delete('from');
      params.delete('return');
      const leftover = params.toString();

      if (fromFinder) {
        const finderPath = leftover ? `finder.html?${leftover}` : 'finder.html';
        const href = safeReturnPath(finderPath) || 'finder.html';
        saveDetailBackPath(href);
        backEl.setAttribute('href', href);
        backEl.textContent = backLabelForPath(href);
        stripLegacyBackParamsFromUrl();
        return;
      }

      if (leftover) {
        const browsePath = `index.html?${leftover}`;
        const safe = safeReturnPath(browsePath);
        if (safe) {
          saveDetailBackPath(safe);
          backEl.setAttribute('href', safe);
          backEl.textContent = backLabelForPath(safe);
          stripLegacyBackParamsFromUrl();
          return;
        }
      }

      backEl.setAttribute('href', 'index.html');
      backEl.textContent = backLabelForPath('index.html');
    }

    function normalizeString(value) {
      if (value == null) return '';
      if (Array.isArray(value)) return value.join(', ');
      return String(value);
    }

    function escapeCsvValue(value) {
      const s = String(value || '');
      const needsQuotes = /[",\n]/.test(s);
      return needsQuotes ? '"' + s.replace(/"/g, '""') + '"' : s;
    }

    function exportToCsv() {
      if (!currentEntry) return;
      
      const primaryKeys = [
        'vendor','model','wifi_gen_radios','spatial_streams','min_poe_class',
        'recommended_poe','behavior_min_power','ethernet_ports_speed',
        'radios_iot_features','antenna_type','antenna_gain_dbi','beamwidth','form_factor','dimensions',
        'weight','antenna_connectors','operating_temp_range','operating_humidity','ingress_protection','datasheet_url'
      ];
      const keys = Object.keys(currentEntry);
      const orderedKeys = [
        ...primaryKeys.filter(k => keys.includes(k)),
        ...keys.filter(k => !primaryKeys.includes(k) && k !== 'msrp').sort()
      ];

      // Build CSV header
      const headers = orderedKeys.map(k => escapeCsvValue(k));
      
      // Build CSV row
      const values = orderedKeys.map(k => {
        const v = currentEntry[k];
        let s;
        if (k === 'antenna_type') {
          s = formatAntennaType(v);
        } else if (k === 'antenna_modes') {
          s = formatModeRows(v).map(row => `${row.label}: ${row.value}`).join('; ');
        } else if (Array.isArray(v)) {
          s = v.join('; ');
        } else if ((k === 'antenna_gain_dbi' || k === 'beamwidth') && v && typeof v === 'object') {
          s = formatBandObject(v, k === 'antenna_gain_dbi' ? 'gain' : 'beam');
        } else if (v && typeof v === 'object' && v !== null) {
          s = JSON.stringify(v);
        } else {
          s = normalizeString(v);
        }
        return escapeCsvValue(s);
      });

      // Combine header and row
      const csv = headers.join(',') + '\n' + values.join(',');

      // Create and download file
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const filename = slugify(`${currentEntry.vendor || 'ap'}-${currentEntry.model || 'details'}`) + '.csv';
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    const fieldLabels = {
      vendor: 'Vendor',
      model: 'Model',
      wifi_gen_radios: 'Wi-Fi Generation & Radios',
      spatial_streams: 'Spatial Streams',
      min_poe_class: 'Minimum PoE Class',
      recommended_poe: 'Recommended PoE',
      behavior_min_power: 'Behavior at Minimum Power',
      ethernet_ports_speed: 'Ethernet Ports & Speed',
      radios_iot_features: 'Radios & IoT Features',
      antenna_type: 'Antenna Type',
      antenna_gain_dbi: 'Antenna Gain (dBi)',
      beamwidth: 'Beamwidth',
      hazloc_certification: 'HazLoc Certification',
      operating_humidity: 'Operating Humidity',
      ingress_protection: 'Ingress Protection',
      form_factor: 'Form Factor',
      hardened: 'Hardened',
      dimensions: 'Dimensions',
      weight: 'Weight',
      antenna_connectors: 'Antenna Connectors',
      operating_temp_range: 'Operating Temperature Range',
      msrp: 'MSRP',
      datasheet_url: 'Datasheet URL',
      install_guide_url: 'Install Guide URL',
      end_of_sale_announcement_date: 'End of Sale Announcement Date',
      end_of_sale_date: 'End of Sale Date',
      end_of_support_date: 'End of Support Date',
      end_of_sale_url: 'End of Sale URL',
      manufacturer_suggested_replacement: 'Manufacturer Suggested Replacement'
    };

    function partLine(part) {
      if (!part || !part.part_number) return '';
      return part.vendor ? `${part.vendor} ${part.part_number}` : part.part_number;
    }

    const PACKAGE_ICON = '<path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z"/><path d="M12 22V12"/><polyline points="3.29 7 12 12 20.71 7"/><path d="m7.5 4.27 9 5.15"/>';
    const WRENCH_ICON = '<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>';
    const CHEVRON_ICON = '<path d="m9 18 6-6-6-6"/>';
    const COPY_ICON = '<rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>';
    const CHECK_ICON = '<path d="M20 6 9 17l-5-5"/>';
    const ALERT_ICON = '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>';

    function iconSvg(markup, size) {
      const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.setAttribute('width', String(size));
      svg.setAttribute('height', String(size));
      svg.setAttribute('viewBox', '0 0 24 24');
      svg.setAttribute('fill', 'none');
      svg.setAttribute('stroke', 'currentColor');
      svg.setAttribute('stroke-width', '2');
      svg.setAttribute('stroke-linecap', 'round');
      svg.setAttribute('stroke-linejoin', 'round');
      svg.setAttribute('aria-hidden', 'true');
      svg.innerHTML = markup;
      return svg;
    }

    function copyAnnouncer() {
      let live = document.getElementById('copy-status');
      if (live) return live;
      live = document.createElement('div');
      live.id = 'copy-status';
      live.className = 'visually-hidden';
      live.setAttribute('aria-live', 'polite');
      document.body.appendChild(live);
      return live;
    }

    function copyPartNumber(text, button) {
      const clipboard = navigator.clipboard;
      if (!clipboard || typeof clipboard.writeText !== 'function') return;
      let pending;
      try {
        pending = clipboard.writeText(text);
      } catch (err) {
        return;
      }
      Promise.resolve(pending).then(() => {
        const svg = button.querySelector('svg');
        button.classList.add('is-copied');
        if (svg) svg.innerHTML = CHECK_ICON;
        const live = copyAnnouncer();
        live.textContent = '';
        window.setTimeout(() => { live.textContent = 'Copied'; }, 30);
        window.clearTimeout(button._copyTimer);
        button._copyTimer = window.setTimeout(() => {
          button.classList.remove('is-copied');
          if (svg) svg.innerHTML = COPY_ICON;
        }, 1500);
      }, () => {});
    }

    function addPartLine(parent, text, pack) {
      const parts = document.createElement('div');
      parts.className = 'mount-nums';
      const label = document.createElement('span');
      label.className = 'part-text';
      if (pack) {
        const prefix = document.createElement('span');
        prefix.className = 'pack-label';
        prefix.textContent = '10-pack: ';
        label.appendChild(prefix);
      }
      label.appendChild(document.createTextNode(text));
      parts.appendChild(label);
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'copy-part';
      button.setAttribute('aria-label', `Copy ${text}`);
      button.title = `Copy ${text}`;
      button.appendChild(iconSvg(COPY_ICON, 16));
      button.addEventListener('mousedown', event => event.stopPropagation());
      button.addEventListener('click', event => {
        event.preventDefault();
        event.stopPropagation();
        copyPartNumber(text, button);
      });
      parts.appendChild(button);
      parent.appendChild(parts);
    }

    function fillCollapseSummary(summary, icon, title, condition, count) {
      const lead = document.createElement('span');
      lead.className = 'sc-lead';
      const iconEl = iconSvg(icon, 18);
      iconEl.classList.add('sc-icon');
      lead.appendChild(iconEl);
      const titleEl = document.createElement('span');
      titleEl.className = 'sc-title';
      titleEl.textContent = title;
      lead.appendChild(titleEl);
      if (condition) {
        const conditionEl = document.createElement('span');
        conditionEl.className = 'sc-condition';
        conditionEl.textContent = condition;
        lead.appendChild(conditionEl);
      }
      summary.appendChild(lead);
      const badge = document.createElement('span');
      badge.className = 'sc-count';
      badge.textContent = count;
      summary.appendChild(badge);
      const chevron = iconSvg(CHEVRON_ICON, 16);
      chevron.classList.add('sc-chevron');
      summary.appendChild(chevron);
    }

    function mountPartLines(parts) {
      const numbers = (Array.isArray(parts) ? parts : [])
        .map(part => part && part.part_number)
        .filter(Boolean);
      const spare = new Set(numbers.filter(number => number.endsWith('=')));
      const kept = numbers.filter(number => number.endsWith('=') || !spare.has(`${number}=`));
      const lines = [];
      for (let i = 0; i < kept.length; i++) {
        const sku = kept[i];
        const next = kept[i + 1];
        const product = next && /^[A-Z0-9]{6}$/.test(next) ? next : '';
        if (product) i += 1;
        lines.push({
          pack: sku.includes('-MP10-'),
          text: product ? `${sku} (${product})` : sku
        });
      }
      return lines;
    }

    function renderMounting(detailsEl, entry, mounts) {
      const slug = apSlug(entry);
      const hasBox = Object.prototype.hasOwnProperty.call(entry, 'in_box');
      const compatible = (Array.isArray(mounts) ? mounts : []).filter(mount =>
        mount && Array.isArray(mount.compatible_aps) && mount.compatible_aps.includes(slug)
      );

      if (hasBox) {
        const boxItems = Array.isArray(entry.in_box) ? entry.in_box : [];
        const boxCount = boxItems.length === 0 ? 'none listed' : `${boxItems.length} ${boxItems.length === 1 ? 'item' : 'items'}`;
        const box = document.createElement('details');
        box.className = 'spec-collapse';
        const boxHeading = document.createElement('summary');
        boxHeading.addEventListener('mousedown', e => e.preventDefault());
        fillCollapseSummary(boxHeading, PACKAGE_ICON, 'In the Box', entry.in_box_condition || '', boxCount);
        box.appendChild(boxHeading);
        const block = document.createElement('div');
        block.className = 'spec-block';
        if (boxItems.length === 0) {
          const empty = document.createElement('p');
          empty.className = 'box-list';
          empty.textContent = 'No mounting hardware included by default; see orderable mounts';
          block.appendChild(empty);
        } else {
          const list = document.createElement('ul');
          list.className = 'mount-list';
          boxItems.forEach(item => {
            if (!item || typeof item !== 'object') return;
            const row = document.createElement('li');
            const name = document.createElement('div');
            name.className = 'mount-name';
            if (item.qty) {
              const qty = document.createElement('span');
              qty.className = 'box-qty';
              qty.textContent = `${item.qty}× `;
              name.appendChild(qty);
            }
            name.appendChild(document.createTextNode(item.item || ''));
            row.appendChild(name);
            if (item.part_number) addPartLine(row, item.part_number, false);
            list.appendChild(row);
          });
          block.appendChild(list);
        }
        const sourceUrl = safeUrl(entry.in_box_source);
        if (sourceUrl) {
          const source = document.createElement('a');
          source.href = sourceUrl;
          source.target = '_blank';
          source.rel = 'noopener noreferrer';
          source.className = 'eos-link';
          source.textContent = 'Source';
          block.appendChild(source);
        }
        box.appendChild(block);
        detailsEl.appendChild(box);
      }

      if (!compatible.length) return;
      const mountsSection = document.createElement('details');
      mountsSection.className = 'spec-collapse';
      const mountsHeading = document.createElement('summary');
      mountsHeading.addEventListener('mousedown', e => e.preventDefault());
      fillCollapseSummary(mountsHeading, WRENCH_ICON, 'Orderable Mounts', '', `${compatible.length} ${compatible.length === 1 ? 'part' : 'parts'}`);
      mountsSection.appendChild(mountsHeading);
      const block = document.createElement('div');
      block.className = 'spec-block';
      const list = document.createElement('ul');
      list.className = 'mount-list';
      compatible.forEach(mount => {
        const row = document.createElement('li');
        const name = document.createElement('div');
        name.className = 'mount-name';
        name.textContent = mount.name || mount.id || '';
        row.appendChild(name);
        mountPartLines(mount.part_numbers).forEach(line => {
          addPartLine(row, line.text, line.pack);
        });
        list.appendChild(row);
      });
      block.appendChild(list);
      mountsSection.appendChild(block);
      detailsEl.appendChild(mountsSection);
    }

    function addSectionHeader(detailsEl, title) {
      const sectionDiv = document.createElement('div');
      sectionDiv.className = 'spec-section';
      const heading = document.createElement('h3');
      heading.textContent = title;
      sectionDiv.appendChild(heading);
      detailsEl.appendChild(sectionDiv);
    }

    async function load() {
      const errorEl = document.getElementById('error-message');
      const titleHeaderEl = document.getElementById('title-header');
      const subtitleEl = document.getElementById('subtitle');
      const detailsEl = document.getElementById('details');
      const imageWrapper = document.getElementById('image-container');
      const imageEl = document.getElementById('ap-image');
      const backEl = document.getElementById('back-link');
      const editLinkEl = document.getElementById('edit-link');

      try {
        const res = await fetch(DATA_URL, { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        let mounts = [];
        try {
          const mountRes = await fetch('mounts.json', { cache: 'no-store' });
          if (mountRes.ok) mounts = await mountRes.json();
        } catch (mountErr) {
          console.warn('Orderable mounts could not be loaded:', mountErr);
        }
        configureBackLink(backEl);

        const id = readId();
        const entry = data.find(e => apSlug(e) === id);
        if (!entry) {
          errorEl.style.display = 'block';
          errorEl.textContent = 'AP not found.';
          return;
        }

        // Store entry for CSV export and image display
        currentEntry = entry;

        const titleText = `${entry.vendor || ''} ${entry.model || ''}`.trim() || 'AP Details';
        titleHeaderEl.textContent = titleText;
        document.title = `${titleText} | Enterprise AP Comparison Database`;
        subtitleEl.textContent = normalizeString(entry.wifi_gen_radios);

        // Add End of Sale alert banner if applicable
        if (entry.end_of_sale_announcement_date || entry.end_of_sale_date) {
          const alert = document.createElement('div');
          alert.className = 'eos-alert';
          const alertIcon = iconSvg(ALERT_ICON, 24);
          alertIcon.classList.add('eos-icon');
          alert.appendChild(alertIcon);
          const content = document.createElement('div');
          content.className = 'eos-content';
          const heading = document.createElement('h4');
          heading.textContent = 'End of Sale Announced';
          content.appendChild(heading);
          const status = document.createElement('p');
          status.appendChild(document.createTextNode('This access point has reached end of sale.'));
          if (entry.end_of_sale_date) {
            status.appendChild(document.createTextNode(' Last order date: '));
            const date = document.createElement('strong');
            date.textContent = entry.end_of_sale_date;
            status.appendChild(date);
          }
          if (entry.end_of_support_date) {
            status.appendChild(document.createTextNode(' • Support ends: '));
            const date = document.createElement('strong');
            date.textContent = entry.end_of_support_date;
            status.appendChild(date);
          }
          content.appendChild(status);
          const noticeUrl = safeUrl(entry.end_of_sale_url);
          if (noticeUrl) {
            const notice = document.createElement('a');
            notice.href = noticeUrl;
            notice.target = '_blank';
            notice.rel = 'noopener noreferrer';
            notice.className = 'eos-link';
            notice.textContent = 'View official notice →';
            content.appendChild(notice);
          }
          if (entry.manufacturer_suggested_replacement && entry.manufacturer_suggested_replacement !== 'None') {
            const replacement = document.createElement('p');
            replacement.style.marginTop = '0.5rem';
            replacement.style.fontSize = '0.85rem';
            replacement.appendChild(document.createTextNode('Suggested replacement: '));
            const model = document.createElement('strong');
            model.textContent = entry.manufacturer_suggested_replacement;
            replacement.appendChild(model);
            content.appendChild(replacement);
          }
          alert.appendChild(content);
          
          // Insert after subtitle
          subtitleEl.insertAdjacentElement('afterend', alert);
        }

        // Set up edit link
        const entrySlug = apSlug(entry);
        editLinkEl.href = `edit.html?id=${encodeURIComponent(entrySlug)}`;
        editLinkEl.style.display = 'inline-flex';
        // External-antenna APs open the AntennaComparison Finder with this AP selected.
        const antennaFinderUrl = antennaFinderHref(entry);
        const antennaFinderEl = document.getElementById('antenna-finder-link');
        if (antennaFinderUrl) {
          antennaFinderEl.href = antennaFinderUrl;
          antennaFinderEl.style.display = 'inline-flex';
        }

        // Handle image, if present
        const imgUrl = safeUrl(entry.image_url, { allowRelative: true });
        if (imgUrl) {
          imageEl.src = imgUrl;
          imageEl.alt = titleText;
          imageWrapper.style.display = 'block';
          imageEl.onerror = () => {
            imageWrapper.style.display = 'none';
          };
        } else {
          imageWrapper.style.display = 'none';
        }

        // Create action buttons area (goes after image, before specs)
        const actionsDiv = document.createElement('div');
        actionsDiv.className = 'detail-actions';
        let hasActions = false;

        const datasheetUrl = safeUrl(entry.datasheet_url);
        if (datasheetUrl) {
          const datasheetBtn = document.createElement('a');
          datasheetBtn.href = datasheetUrl;
          datasheetBtn.target = '_blank';
          datasheetBtn.rel = 'noopener noreferrer';
          datasheetBtn.className = 'btn-inline-action';
          datasheetBtn.innerHTML = `
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <line x1="16" y1="13" x2="8" y2="13"></line>
              <line x1="16" y1="17" x2="8" y2="17"></line>
              <polyline points="10 9 9 9 8 9"></polyline>
            </svg>
            <span>Datasheet</span>
          `;
          actionsDiv.appendChild(datasheetBtn);
          hasActions = true;
        }

        const installGuideUrl = safeUrl(entry.install_guide_url);
        if (installGuideUrl) {
          const installGuideBtn = document.createElement('a');
          installGuideBtn.href = installGuideUrl;
          installGuideBtn.target = '_blank';
          installGuideBtn.rel = 'noopener noreferrer';
          installGuideBtn.className = 'btn-inline-action';
          installGuideBtn.innerHTML = `
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
              <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
            </svg>
            <span>Install Guide</span>
          `;
          actionsDiv.appendChild(installGuideBtn);
          hasActions = true;
        }

        // Where the numbers come from, and how to report a problem with them.
        const sourceNote = document.createElement('p');
        sourceNote.className = 'source-note';
        sourceNote.appendChild(document.createTextNode(
          "Specifications come from the vendor's own datasheet and installation guide. Spot an error? "
        ));
        const reportLink = document.createElement('a');
        const issueTitle = `Data issue: ${entry.vendor || ''} ${entry.model || ''}`.trim();
        const issueBody = [
          `AP: ${entry.vendor || ''} ${entry.model || ''}`,
          `Page: ${window.location.href}`,
          '',
          'Field and current value:',
          '',
          'Correct value:',
          '',
          "Vendor source (datasheet or install guide on the vendor's site):",
          ''
        ].join('\n');
        reportLink.href = 'https://github.com/danryan06/ap-comparison/issues/new?' +
          new URLSearchParams({ title: issueTitle, body: issueBody }).toString();
        reportLink.target = '_blank';
        reportLink.rel = 'noopener noreferrer';
        reportLink.textContent = 'Report it on GitHub';
        sourceNote.appendChild(reportLink);
        sourceNote.appendChild(document.createTextNode('.'));
        actionsDiv.appendChild(sourceNote);
        hasActions = true;

        // Insert actions before the details grid
        if (hasActions) {
          detailsEl.parentNode.insertBefore(actionsDiv, detailsEl);
        }


        detailsEl.innerHTML = '';
        const renderKV = (k, v, isLastInSection = false) => {
          // Skip image_url
          if (k === 'image_url') return;
          
          const keyDiv = document.createElement('div');
          keyDiv.className = 'key';
          if (isLastInSection) {
            keyDiv.classList.add('last-field');
          }
          
          // Highlight EoS-related fields
          const eosFields = ['end_of_sale_announcement_date', 'end_of_sale_date', 'end_of_support_date', 'end_of_sale_url', 'manufacturer_suggested_replacement'];
          if (eosFields.includes(k)) {
            keyDiv.classList.add('eos-key');
          }
          
          keyDiv.textContent = fieldLabels[k] || k;
          const valDiv = document.createElement('div');
          valDiv.className = 'val';
          if (isLastInSection) {
            valDiv.classList.add('last-field');
          }
          
          // Highlight EoS values
          if (eosFields.includes(k)) {
            valDiv.classList.add('eos-val');
          }
          if (k === 'hardened') {
            valDiv.textContent = v === true ? 'Yes' : '';
          } else if (k === 'antenna_type') {
            valDiv.textContent = formatAntennaType(v);
          } else if (k === 'antenna_gain_dbi' && v && typeof v === 'object') {
            valDiv.textContent = formatBandObject(v, 'gain');
          } else if (k === 'beamwidth' && v && typeof v === 'object') {
            const parts = flatBandParts(v, 'beam');
            if (parts) {
              const wrapper = document.createElement('div');
              wrapper.className = 'beamwidth-value';
              parts.forEach(part => {
                const span = document.createElement('span');
                span.className = 'beamwidth-band';
                span.textContent = part.text;
                wrapper.appendChild(span);
              });
              valDiv.appendChild(wrapper);
            } else {
              valDiv.textContent = formatBandObject(v, 'beam');
            }
          } else if (Array.isArray(v)) {
            valDiv.textContent = v.join(', ');
          } else if (k.endsWith('_url') && v && typeof v === 'string' && v.trim()) {
            const url = safeUrl(v);
            if (url) {
              const link = document.createElement('a');
              link.href = url;
              link.target = '_blank';
              link.rel = 'noopener noreferrer';
              link.textContent = v;
              link.style.color = '#60a5fa';
              link.style.textDecoration = 'underline';
              valDiv.appendChild(link);
            } else {
              valDiv.textContent = v;
            }
          } else if (v && typeof v === 'object' && v !== null) {
            // Handle other objects generically
            valDiv.textContent = JSON.stringify(v);
          } else {
            valDiv.textContent = normalizeString(v);
          }
          detailsEl.appendChild(keyDiv);
          detailsEl.appendChild(valDiv);
        };

        // Define sections with their fields
        const sections = [
          {
            title: 'Basic Information',
            fields: ['vendor', 'model', 'wifi_gen_radios', 'spatial_streams']
          },
          {
            title: 'Power Requirements',
            fields: ['min_poe_class', 'recommended_poe', 'behavior_min_power']
          },
          {
            title: 'Connectivity',
            fields: ['ethernet_ports_speed', 'radios_iot_features']
          },
          {
            title: 'Antenna Specifications',
            fields: ['antenna_type', 'antenna_gain_dbi', 'beamwidth', 'antenna_connectors']
          },
          {
            title: 'Physical Specifications',
            fields: ['form_factor', 'hardened', 'dimensions', 'weight', 'operating_temp_range', 'operating_humidity', 'ingress_protection', 'hazloc_certification']
          },
          {
            title: 'End of Life Information',
            fields: ['end_of_sale_announcement_date', 'end_of_sale_date', 'end_of_support_date', 'end_of_sale_url', 'manufacturer_suggested_replacement']
          },
          {
            title: 'Documentation',
            fields: ['install_guide_url']
          }
        ];

        // Render sections
        sections.forEach(section => {
          const fieldsToRender = section.fields.filter(field =>
            entry.hasOwnProperty(field) && entry[field] != null && entry[field] !== '' &&
            !(Array.isArray(entry[field]) && entry[field].length === 0)
          );
          const rows = [];
          fieldsToRender.forEach(field => {
            if (field === 'beamwidth' && beamwidthModeRows(entry.beamwidth).length) {
              beamwidthModeRows(entry.beamwidth).forEach(mode => {
                rows.push({ key: mode.label, value: mode.value });
              });
            } else {
              rows.push({ key: field, value: entry[field] });
            }
            const modeAnchor = field === 'beamwidth' || (field === 'antenna_gain_dbi' && !fieldsToRender.includes('beamwidth'));
            if (section.title === 'Antenna Specifications' && modeAnchor) {
              formatModeRows(entry.antenna_modes).forEach(mode => {
                rows.push({ key: mode.label, value: mode.value });
              });
            }
          });
          if (section.title === 'Antenna Specifications') {
            const modeRows = formatModeRows(entry.antenna_modes);
            const already = modeRows.some(mode => rows.some(row => row.key === mode.label));
            if (!already && modeRows.length) {
              const connectorIndex = rows.findIndex(row => row.key === 'antenna_connectors');
              const insertAt = connectorIndex === -1 ? rows.length : connectorIndex;
              modeRows.forEach((mode, offset) => {
                rows.splice(insertAt + offset, 0, { key: mode.label, value: mode.value });
              });
            }
          }
          
          if (rows.length > 0) {
            addSectionHeader(detailsEl, section.title);
            rows.forEach((row, index) => {
              const isLast = index === rows.length - 1;
              renderKV(row.key, row.value, isLast);
            });
          }
          if (section.title === 'Antenna Specifications' && rows.length > 0 && antennaFinderHref(entry)) {
            const callout = document.createElement('p');
            callout.className = 'antenna-finder-callout';
            callout.appendChild(document.createTextNode('Need antennas for this AP? '));
            const link = document.createElement('a');
            link.href = antennaFinderHref(entry);
            link.target = '_blank';
            link.rel = 'noopener noreferrer';
            link.textContent = 'See which antennas fit it on AntennaComparison \u2197';
            callout.appendChild(link);
            detailsEl.appendChild(callout);
          }
          if (section.title === 'Physical Specifications') {
            renderMounting(detailsEl, entry, mounts);
          }
        });

        // Render any remaining fields not in sections
        const allSectionFields = sections.flatMap(s => s.fields);
        const remainingFields = Object.keys(entry).filter(k => 
          !allSectionFields.includes(k) && 
          k !== 'image_url' && 
          k !== 'datasheet_url' &&
          k !== 'msrp' &&
          k !== 'antenna_modes' &&
          k !== 'in_box' &&
          k !== 'in_box_source' &&
          k !== 'in_box_condition' &&
          entry[k] != null &&
          entry[k] !== ''
        ).sort();
        
        if (remainingFields.length > 0) {
          addSectionHeader(detailsEl, 'Additional Information');
          remainingFields.forEach((k, index) => {
            const isLast = index === remainingFields.length - 1;
            renderKV(k, entry[k], isLast);
          });
        }

      } catch (err) {
        console.error('Failed to load AP details:', err);
        errorEl.style.display = 'block';
        errorEl.textContent = 'Failed to load AP details.';
        configureBackLink(backEl);
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      const exportBtn = document.getElementById('export-csv');
      if (exportBtn) {
        exportBtn.addEventListener('click', exportToCsv);
      }
    });

    load();
  </script>
</body>
<!-- End of ap.html -->
</html>
