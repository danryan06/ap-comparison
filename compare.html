<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Compare APs | Enterprise AP Comparison Database</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Side-by-side comparison of enterprise Wi-Fi access points." />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="AP Comparison" />
  <meta property="og:title" content="Compare APs" />
  <meta property="og:description" content="Side-by-side comparison of enterprise Wi-Fi access points." />
  <meta property="og:url" content="https://apcomparison.com/compare.html" />
  <meta property="og:image" content="https://apcomparison.com/logo.png" />
  <meta name="twitter:card" content="summary" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="stylesheet" href="style.css?v=2" />
</head>
<body>
  <header class="site-header" data-page="compare"></header>
  <script src="site-header.js?v=1"></script>

  <div class="container">
    <div class="actions">
      <a id="back-link" class="btn-link" href="index.html">&larr; Back to AP Table</a>
      <button id="export-csv" type="button" class="btn-link">Export CSV</button>
    </div>

    <div class="card">
      <span class="badge">Comparison</span>
      <h1>Compare Access Points</h1>
      <div class="compare-toolbar">
        <p class="subtitle" id="compare-summary">Loading&hellip;</p>
        <label class="chip-option">
          <input type="checkbox" id="diff-only" />
          <span>Show differences only</span>
        </label>
      </div>

      <div id="error-message" class="error" style="display:none;"></div>

      <div class="compare-scroll">
        <table id="compare-grid" class="compare-grid"></table>
      </div>
    </div>
  </div>

  <script src="ap-format.js?v=7"></script>
  <script>
    const DATA_URL = 'ap_data.json';
    const MOUNTS_URL = 'mounts.json';
    let currentSelected = [];
    let currentRows = [];

    // Rows in display order. value(entry) returns display text ('' when the AP has no value).
    function joinList(value) {
      return Array.isArray(value) ? value.join(', ') : (value == null ? '' : String(value));
    }

    function plain(key) {
      return entry => joinList(entry[key]);
    }

    function inBoxText(entry) {
      if (!Array.isArray(entry.in_box)) return 'Not checked yet';
      if (!entry.in_box.length) return 'Nothing listed beyond the AP';
      const items = entry.in_box.map(line => {
        const qty = line.qty != null ? `${line.qty}\u00d7 ` : '';
        const part = line.part_number ? ` (${line.part_number})` : '';
        return `${qty}${line.item}${part}`;
      });
      return items.join('; ') + (entry.in_box_condition ? ` [${entry.in_box_condition}]` : '');
    }

    function mountsText(entry, mounts) {
      const slug = apSlug(entry);
      const list = mounts.filter(m => Array.isArray(m.compatible_aps) && m.compatible_aps.includes(slug));
      if (!list.length) return '';
      return list.map(m => {
        const numbers = (m.part_numbers || []).map(p => p.part_number).filter(n => !/=$/.test(n));
        return numbers.length ? `${m.name} (${numbers.join(', ')})` : m.name;
      }).join('; ');
    }

    function buildRows(selected, mounts) {
      const rows = [];
      const section = title => rows.push({ section: title });
      const add = (label, value, opts = {}) => rows.push({ label, value, ...opts });

      section('Radios');
      add('Wi-Fi generation & radios', plain('wifi_gen_radios'));
      add('Spatial streams', plain('spatial_streams'));
      add('Radios & IoT features', entry => Array.isArray(entry.radios_iot_features) && !entry.radios_iot_features.length ? 'None' : joinList(entry.radios_iot_features));

      section('Power');
      add('Minimum PoE class', plain('min_poe_class'));
      add('Recommended PoE', plain('recommended_poe'));
      add('Behavior at minimum power', plain('behavior_min_power'), { long: true });

      section('Wired');
      add('Ethernet ports & speed', plain('ethernet_ports_speed'));

      section('Antennas');
      add('Antenna type', entry => formatAntennaType(entry.antenna_type));
      add('Antenna gain', entry => formatBandObject(entry.antenna_gain_dbi, 'gain'));
      // Flat beamwidth is one row; vendor-presented beamwidth modes get one row per mode name.
      add('Beamwidth', entry => beamwidthModeRows(entry.beamwidth).length ? '' : formatBandObject(entry.beamwidth, 'beam'));
      const modeLabels = [];
      selected.forEach(entry => {
        beamwidthModeRows(entry.beamwidth).concat(formatModeRows(entry.antenna_modes)).forEach(row => {
          if (!modeLabels.includes(row.label)) modeLabels.push(row.label);
        });
      });
      modeLabels.forEach(label => {
        add(label, entry => {
          const row = beamwidthModeRows(entry.beamwidth).concat(formatModeRows(entry.antenna_modes)).find(r => r.label === label);
          return row ? row.value : '';
        });
      });
      add('Antenna connectors', plain('antenna_connectors'));

      section('Physical');
      add('Form factor', entry => entry.form_factor ? (entry.hardened ? `${entry.form_factor}, hardened` : entry.form_factor) : '');
      add('Dimensions', plain('dimensions'));
      add('Weight', plain('weight'));
      add('Operating temperature', plain('operating_temp_range'));
      add('Operating humidity', plain('operating_humidity'));
      add('Ingress protection', plain('ingress_protection'));
      add('HazLoc certification', plain('hazloc_certification'));
      add('Environmental certifications', plain('environmental_certifications'), { long: true });

      section('Mounting');
      add('In the box', inBoxText, { long: true });
      add('Orderable mounts', entry => mountsText(entry, mounts), { long: true });

      section('Lifecycle');
      add('End of sale', plain('end_of_sale_date'));
      add('End of support', plain('end_of_support_date'));
      add('Suggested replacement', plain('manufacturer_suggested_replacement'));

      // Resolve values; drop rows no selected AP has, then sections left empty.
      const resolved = rows.map(row => row.section ? row : {
        ...row,
        values: selected.map(entry => String(row.value(entry) || '').trim())
      }).filter(row => row.section || row.values.some(Boolean));
      return resolved.filter((row, index) => {
        if (!row.section) return true;
        const next = resolved[index + 1];
        return next && !next.section;
      }).map(row => row.section ? row : {
        ...row,
        differs: new Set(row.values).size > 1
      });
    }

    function readIds() {
      const params = new URLSearchParams(window.location.search);
      return (params.get('ids') || '').split(',').map(s => s.trim()).filter(Boolean);
    }

    function buildBackLink() {
      const params = new URLSearchParams(window.location.search);
      params.delete('ids');
      const backUrl = 'index.html' + (params.toString() ? '?' + params.toString() : '');
      document.getElementById('back-link').setAttribute('href', backUrl);
    }

    function compareUrlWithout(id) {
      const params = new URLSearchParams(window.location.search);
      params.set('ids', readIds().filter(other => other !== id).join(','));
      return 'compare.html?' + params.toString();
    }

    function headerCell(entry) {
      const th = document.createElement('th');
      th.scope = 'col';
      th.className = 'compare-ap';
      const id = apSlug(entry);

      const remove = document.createElement('a');
      remove.className = 'compare-remove';
      remove.href = compareUrlWithout(id);
      remove.setAttribute('aria-label', `Remove ${entry.vendor} ${entry.model} from the comparison`);
      remove.textContent = '\u00d7';
      th.appendChild(remove);

      const imageUrl = safeUrl(entry.image_url, { allowRelative: true });
      if (imageUrl) {
        const img = document.createElement('img');
        img.src = imageUrl;
        img.alt = `${entry.vendor} ${entry.model}`;
        img.loading = 'lazy';
        img.className = 'compare-image';
        th.appendChild(img);
      }

      const vendor = document.createElement('div');
      vendor.className = 'compare-vendor';
      vendor.textContent = entry.vendor || '';
      th.appendChild(vendor);

      const model = document.createElement('a');
      model.className = 'compare-model';
      model.href = buildApDetailHref(id);
      model.textContent = entry.model || '';
      model.addEventListener('click', () => saveDetailBackPath(window.location.pathname.split('/').pop() + window.location.search));
      th.appendChild(model);

      const links = document.createElement('div');
      links.className = 'compare-links';
      const datasheetUrl = safeUrl(entry.datasheet_url);
      if (datasheetUrl) {
        const a = document.createElement('a');
        a.href = datasheetUrl;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.textContent = 'Datasheet';
        links.appendChild(a);
      }
      const antennaUrl = antennaFinderHref(entry);
      if (antennaUrl) {
        const a = document.createElement('a');
        a.href = antennaUrl;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.textContent = 'Antennas';
        links.appendChild(a);
      }
      th.appendChild(links);
      return th;
    }

    function render(selected, rows) {
      const table = document.getElementById('compare-grid');
      table.innerHTML = '';
      table.style.setProperty('--compare-cols', selected.length);
      const thead = document.createElement('thead');
      const headRow = document.createElement('tr');
      const corner = document.createElement('th');
      corner.scope = 'col';
      corner.className = 'compare-label';
      corner.textContent = `${selected.length} APs`;
      headRow.appendChild(corner);
      selected.forEach(entry => headRow.appendChild(headerCell(entry)));
      thead.appendChild(headRow);
      table.appendChild(thead);

      const tbody = document.createElement('tbody');
      rows.forEach((row, index) => {
        const tr = document.createElement('tr');
        if (row.section) {
          tr.className = 'compare-section';
          // A section with no differing rows is hidden by "Show differences only".
          const end = rows.findIndex((other, j) => j > index && other.section);
          const body = rows.slice(index + 1, end === -1 ? rows.length : end);
          if (!body.some(other => other.differs)) tr.classList.add('compare-same');
          const th = document.createElement('th');
          th.scope = 'colgroup';
          th.colSpan = selected.length + 1;
          th.textContent = row.section;
          tr.appendChild(th);
        } else {
          if (row.differs) tr.classList.add('compare-differs');
          else tr.classList.add('compare-same');
          if (row.long) tr.classList.add('compare-long');
          const th = document.createElement('th');
          th.scope = 'row';
          th.className = 'compare-label';
          th.textContent = row.label;
          tr.appendChild(th);
          row.values.forEach(value => {
            const td = document.createElement('td');
            if (value) {
              td.textContent = value;
            } else {
              td.className = 'compare-empty';
              td.textContent = 'Not listed';
            }
            tr.appendChild(td);
          });
        }
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);

      const differing = rows.filter(row => !row.section && row.differs).length;
      const total = rows.filter(row => !row.section).length;
      document.getElementById('compare-summary').textContent =
        `${differing} of ${total} rows differ. Rows that differ are marked on the left.`;
    }

    function applyDiffFilter() {
      const on = document.getElementById('diff-only').checked;
      document.getElementById('compare-grid').classList.toggle('diff-only', on);
      const params = new URLSearchParams(window.location.search);
      if (on) params.set('diff', '1'); else params.delete('diff');
      history.replaceState({}, '', 'compare.html?' + params.toString());
    }

    function csvCell(value) {
      const s = String(value == null ? '' : value);
      return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    }

    function exportCsv() {
      if (!currentSelected.length) return;
      const lines = [];
      lines.push(['Field', ...currentSelected.map(e => `${e.vendor} ${e.model}`)].map(csvCell).join(','));
      currentRows.filter(row => !row.section).forEach(row => {
        lines.push([row.label, ...row.values].map(csvCell).join(','));
      });
      const blob = new Blob([lines.join('\n') + '\n'], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'ap-comparison.csv';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    async function load() {
      buildBackLink();
      const errorEl = document.getElementById('error-message');
      try {
        const [dataRes, mountsRes] = await Promise.all([
          fetch(DATA_URL, { cache: 'no-store' }),
          fetch(MOUNTS_URL, { cache: 'no-store' }).catch(() => null)
        ]);
        if (!dataRes.ok) throw new Error('HTTP ' + dataRes.status);
        const data = await dataRes.json();
        const mounts = mountsRes && mountsRes.ok ? await mountsRes.json() : [];
        // Keep the order the APs were picked in.
        const selected = readIds()
          .map(id => data.find(entry => apSlug(entry) === id))
          .filter((entry, index, list) => entry && list.indexOf(entry) === index);

        if (selected.length < 2) {
          errorEl.style.display = 'block';
          errorEl.textContent = 'Select at least two APs to compare. Use the Browse table or the Finder to pick APs.';
          document.getElementById('compare-summary').textContent = '';
          document.querySelector('.compare-scroll').style.display = 'none';
          document.querySelector('.compare-toolbar').style.display = 'none';
          return;
        }
        currentSelected = selected;
        currentRows = buildRows(selected, mounts);
        render(selected, currentRows);
        const params = new URLSearchParams(window.location.search);
        document.getElementById('diff-only').checked = params.get('diff') === '1';
        document.getElementById('compare-grid').classList.toggle('diff-only', params.get('diff') === '1');
      } catch (err) {
        console.error('Failed to load comparison:', err);
        errorEl.style.display = 'block';
        errorEl.textContent = 'Failed to load comparison.';
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('export-csv').addEventListener('click', exportCsv);
      document.getElementById('diff-only').addEventListener('change', applyDiffFilter);
      load();
    });
  </script>
</body>
</html>
