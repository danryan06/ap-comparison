name: Refresh site meta

# Rebuilds site-meta.json (per-entry "last edited" dates and the Recent
# changes list) whenever main changes, and commits it back if it differs.
on:
  push:
    branches: [main]
    paths-ignore:
      - site-meta.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-meta
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for git blame and log)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Generate site-meta.json
        run: node .github/scripts/generate-site-meta.js

      - name: Commit if changed
        run: |
          if git diff --quiet -- site-meta.json; then
            echo "site-meta.json is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add site-meta.json
          git commit -m "Refresh site-meta.json"
          git pull --rebase origin main
          git push origin HEAD:main
