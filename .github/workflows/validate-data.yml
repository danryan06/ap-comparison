name: Validate AP Data

on:
  push:
    paths:
      - 'ap_data.json'
      - 'mounts.json'
      - 'ap_template.json'
      - 'templates/**'
      - '*.html'
      - '*.js'
      - '*.css'
      - 'fonts/**'
      - '.github/workflows/**'
      - '.github/scripts/**'
  pull_request:
    paths:
      - 'ap_data.json'
      - 'mounts.json'
      - 'ap_template.json'
      - 'templates/**'
      - '*.html'
      - '*.js'
      - '*.css'
      - 'fonts/**'
      - '.github/workflows/**'
      - '.github/scripts/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Validate AP data
        run: node .github/scripts/validate-data.js
      - name: Validate site data and assets
        run: node .github/scripts/validate-site.js


